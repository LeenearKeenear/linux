name: Build objtool

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Linux kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          make \
          gcc \
          libelf-dev \
          libssl-dev \
          pkg-config \
          bison \
          flex \
          gawk \
          binutils-dev

    - name: Build objtool
      run: |
        cd tools/objtool
        make

    - name: Verify objtool binary
      run: |
        if [ -f "tools/objtool/objtool" ]; then
          echo "objtool built successfully!"
          ./tools/objtool/objtool --help || true
        else
          echo "Error: objtool binary not found." && exit 1
        fi

    - name: Upload objtool artifact
      uses: actions/upload-artifact@v4
      with:
        name: objtool-binary
        path: tools/objtool/objtool
